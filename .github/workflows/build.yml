name: Build

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal Binary (x86_64 + arm64)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify architecture
        run: |
          echo "Current architecture: $(uname -m)"
          echo "Building Universal Binary (x86_64 + arm64)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build C++ binding (Universal Binary)
        run: |
          node scripts/gen-icons.js
          npx node-gyp rebuild

      - name: Build Swift library (Universal Binary)
        run: |
          mkdir -p lib

          # 分别编译两个架构
          echo "Building arm64 version..."
          swiftc -emit-library \
            -o lib/libZToolsNative_arm64.dylib \
            src/ZToolsNative.swift \
            -framework Cocoa \
            -target arm64-apple-macosx11.0 \
            -Osize

          echo "Building x86_64 version..."
          swiftc -emit-library \
            -o lib/libZToolsNative_x86_64.dylib \
            src/ZToolsNative.swift \
            -framework Cocoa \
            -target x86_64-apple-macosx10.15 \
            -Osize

          # 合并成 Universal Binary
          echo "Creating Universal Binary..."
          lipo -create \
            lib/libZToolsNative_arm64.dylib \
            lib/libZToolsNative_x86_64.dylib \
            -output lib/libZToolsNative.dylib

          # 清理临时文件
          rm lib/libZToolsNative_arm64.dylib lib/libZToolsNative_x86_64.dylib

      - name: Verify build outputs
        run: |
          echo "Checking build outputs..."

          # 检查 .node 文件
          if [ -f "build/Release/ztools_native.node" ]; then
            echo "✅ .node file built successfully"
            file build/Release/ztools_native.node
            lipo -info build/Release/ztools_native.node
            otool -L build/Release/ztools_native.node
          else
            echo "❌ .node file not found"
            exit 1
          fi

          # 检查 .dylib 文件
          if [ -f "lib/libZToolsNative.dylib" ]; then
            echo "✅ .dylib file built successfully"
            file lib/libZToolsNative.dylib
            lipo -info lib/libZToolsNative.dylib
            otool -L lib/libZToolsNative.dylib
          else
            echo "❌ .dylib file not found"
            exit 1
          fi

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/Release/ztools_native.node artifacts/ztools_native-macos-universal.node
          cp lib/libZToolsNative.dylib artifacts/libZToolsNative-macos-universal.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztools-native-macos
          path: artifacts/
          retention-days: 30

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npm run build

      - name: Verify build output
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          Write-Host "Checking build output..."

          if (!(Test-Path "build/Release/ztools_native.node")) {
            throw ".node file not found"
          }

          Get-Item "build/Release/ztools_native.node" | Format-List

          $peCheck = @'
          const fs = require('node:fs');

          const file = 'build/Release/ztools_native.node';
          const expectedMachines = { x64: 0x8664, arm64: 0xaa64 };
          const arch = process.env.TARGET_ARCH;
          const expected = expectedMachines[arch];
          const binary = fs.readFileSync(file);

          if (expected === undefined) {
            throw new Error(`Unsupported target architecture: ${arch}`);
          }
          if (binary.length < 0x40 || binary.readUInt16LE(0) !== 0x5a4d) {
            throw new Error(`${file} does not have a valid DOS header`);
          }

          const peOffset = binary.readUInt32LE(0x3c);
          if (peOffset + 6 > binary.length || binary.readUInt32LE(peOffset) !== 0x00004550) {
            throw new Error(`${file} does not have a valid PE header`);
          }

          const machine = binary.readUInt16LE(peOffset + 4);
          console.log(`PE machine for ${arch}: 0x${machine.toString(16)}`);
          if (machine !== expected) {
            throw new Error(
              `Expected PE machine 0x${expected.toString(16)} for ${arch}, got 0x${machine.toString(16)}`,
            );
          }
          '@

          $peCheck | node -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/Release/ztools_native.node" "artifacts/ztools_native-win-${{ matrix.arch }}.node"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztools-native-windows-${{ matrix.arch }}
          path: artifacts/
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ztools-native-macos
          path: macos-artifacts

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ztools-native-windows-x64
          path: windows-x64-artifacts

      - name: Download Windows arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ztools-native-windows-arm64
          path: windows-arm64-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-artifacts/ztools_native-macos-universal.node
            macos-artifacts/libZToolsNative-macos-universal.dylib
            windows-x64-artifacts/ztools_native-win-x64.node
            windows-arm64-artifacts/ztools_native-win-arm64.node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
