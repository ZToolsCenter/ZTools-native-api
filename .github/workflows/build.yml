name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal Binary (x86_64 + arm64)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify architecture
        run: |
          echo "Current architecture: $(uname -m)"
          echo "Building Universal Binary (x86_64 + arm64)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build C++ binding (Universal Binary)
        run: |
          node scripts/gen-icons.js
          npx node-gyp rebuild

      - name: Build Swift library (Universal Binary)
        run: |
          mkdir -p lib

          # 长截图算法层 C++ 对象（与 scripts/build-swift.sh
          # 逐字一致，两处编译参数必须同步修改。Apple clang 的 C++ 不支持 -Osize，
          # 取等价的 -Oz）
          LC_CXX_SOURCES=(
            src/screenshot/algo/lc_match_core.cpp
            src/screenshot/algo/lc_stitch_state.cpp
            src/screenshot/macos/lc_bridge_mac.cpp
          )
          LC_CXX_FLAGS=(-c -std=c++17 -Oz -DNDEBUG -I src/screenshot/algo)

          echo "Compiling long-capture algorithm layer objects (arm64)..."
          mkdir -p build/lc-obj-arm64
          LC_OBJS_ARM64=()
          for src in "${LC_CXX_SOURCES[@]}"; do
            obj="build/lc-obj-arm64/$(basename "${src%.cpp}").o"
            clang++ "${LC_CXX_FLAGS[@]}" -arch arm64 -mmacosx-version-min=11.0 -o "$obj" "$src"
            LC_OBJS_ARM64+=("$obj")
          done

          echo "Compiling long-capture algorithm layer objects (x86_64)..."
          mkdir -p build/lc-obj-x86_64
          LC_OBJS_X86_64=()
          for src in "${LC_CXX_SOURCES[@]}"; do
            obj="build/lc-obj-x86_64/$(basename "${src%.cpp}").o"
            clang++ "${LC_CXX_FLAGS[@]}" -arch x86_64 -mmacosx-version-min=10.15 -o "$obj" "$src"
            LC_OBJS_X86_64+=("$obj")
          done

          # Swift 源文件清单（多文件单模块编译；必须与 scripts/build-swift.sh 保持一致）
          SWIFT_SOURCES=(
            src/ZToolsNative.swift
            src/screenshot/macos/ScreenshotMac.swift
            src/screenshot/macos/ScreenshotOverlayMac.swift
            src/screenshot/macos/ScreenshotPaintMac.swift
            src/screenshot/macos/ScreenshotAnnotationsMac.swift
            src/screenshot/macos/ScreenshotToolbarMac.swift
            src/screenshot/macos/ScreenshotTextMac.swift
            src/screenshot/macos/ScreenshotMosaicMac.swift
            src/screenshot/macos/ScreenshotOutputMac.swift
            src/screenshot/macos/ScreenshotLongCaptureMac.swift
            src/screenshot/macos/ScreenshotLCPanelMac.swift
            src/screenshot/macos/ScreenshotLCToolbarMac.swift
            src/screenshot/macos/LCBridgeMac.swift
            src/generated/icon_svgs.swift
          )

          # 分别编译两个架构
          echo "Building arm64 version..."
          swiftc -emit-library \
            -o lib/libZToolsNative_arm64.dylib \
            "${SWIFT_SOURCES[@]}" \
            "${LC_OBJS_ARM64[@]}" \
            -framework Cocoa \
            -lc++ \
            -target arm64-apple-macosx11.0 \
            -Osize

          echo "Building x86_64 version..."
          swiftc -emit-library \
            -o lib/libZToolsNative_x86_64.dylib \
            "${SWIFT_SOURCES[@]}" \
            "${LC_OBJS_X86_64[@]}" \
            -framework Cocoa \
            -lc++ \
            -target x86_64-apple-macosx10.15 \
            -Osize

          # 合并成 Universal Binary
          echo "Creating Universal Binary..."
          lipo -create \
            lib/libZToolsNative_arm64.dylib \
            lib/libZToolsNative_x86_64.dylib \
            -output lib/libZToolsNative.dylib

          # 清理临时文件
          rm lib/libZToolsNative_arm64.dylib lib/libZToolsNative_x86_64.dylib
          rm -rf build/lc-obj-arm64 build/lc-obj-x86_64

      - name: Verify build outputs
        run: |
          echo "Checking build outputs..."

          # 检查 .node 文件
          if [ -f "build/Release/ztools_native.node" ]; then
            echo "✅ .node file built successfully"
            file build/Release/ztools_native.node
            lipo -info build/Release/ztools_native.node
            otool -L build/Release/ztools_native.node
          else
            echo "❌ .node file not found"
            exit 1
          fi

          # 检查 .dylib 文件
          if [ -f "lib/libZToolsNative.dylib" ]; then
            echo "✅ .dylib file built successfully"
            file lib/libZToolsNative.dylib
            lipo -info lib/libZToolsNative.dylib
            otool -L lib/libZToolsNative.dylib
          else
            echo "❌ .dylib file not found"
            exit 1
          fi

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/Release/ztools_native.node artifacts/ztools_native-macos-universal.node
          cp lib/libZToolsNative.dylib artifacts/libZToolsNative-macos-universal.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztools-native-macos
          path: artifacts/
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npm run build

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "Checking build output..."

          if (Test-Path "build/Release/ztools_native.node") {
            Write-Host "✅ .node file built successfully"
            Get-Item "build/Release/ztools_native.node" | Format-List
          } else {
            Write-Host "❌ .node file not found"
            exit 1
          }

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/Release/ztools_native.node" "artifacts/ztools_native-win-x64.node"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ztools-native-windows
          path: artifacts/
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ztools-native-macos
          path: macos-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ztools-native-windows
          path: windows-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-artifacts/ztools_native-macos-universal.node
            macos-artifacts/libZToolsNative-macos-universal.dylib
            windows-artifacts/ztools_native-win-x64.node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
